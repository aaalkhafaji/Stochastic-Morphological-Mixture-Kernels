name: Step 10 Generalization calibration and scaling

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  step10:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STEP5_ARTIFACT_ID: '10035125626'
      STEP5_ARTIFACT_SHA256: '889e7df9af279974d46595444bf768c627602d188ca8c93d0f65b30739f16e96'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Step 10 offline smoke test
        env:
          PYTHONPATH: code
        run: python code/test_step10_smoke.py

      - name: Download frozen Step 5 result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .step10_inputs
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STEP5_ARTIFACT_ID}/zip"
          curl --fail --location --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" -o .step10_inputs/step5-oxford-pet-results.zip
          echo "${STEP5_ARTIFACT_SHA256}  .step10_inputs/step5-oxford-pet-results.zip" | sha256sum -c -

      - name: Verify Step 10 artifact compatibility
        env:
          PYTHONPATH: code
        run: python code/test_step10_artifact.py .step10_inputs/step5-oxford-pet-results.zip

      - name: Run full Step 10 campaign
        env:
          PYTHONPATH: code
        run: |
          rm -rf results/step10_generalization data/davis2016_step10
          python code/run_step10_generalization.py \
            --step5-artifact .step10_inputs/step5-oxford-pet-results.zip \
            --download-davis \
            --davis-root data/davis2016_step10 \
            --output-dir results/step10_generalization \
            --scaling-repeats 3

      - name: Verify full Step 10 result bytes
        shell: bash
        run: |
          set -euo pipefail
          cd results/step10_generalization
          sha256sum -c SHA256SUMS
          test -s step10_calibration_summary.csv
          test -s step10_selective_risk.csv
          test -s step10_davis_transfer_summary.csv
          test -s step10_scaling.csv
          test -s step10_provenance.json

      - name: Build compact Step 10 artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results/step10_artifact
          mkdir -p results/step10_artifact
          find results/step10_generalization -maxdepth 1 -type f ! -name '*.npz' ! -name 'SHA256SUMS' -print0 | \
            xargs -0 -I{} cp {} results/step10_artifact/
          cd results/step10_artifact
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload Step 10 results
        uses: actions/upload-artifact@v4
        with:
          name: step10-generalization-calibration-results
          path: results/step10_artifact/
          compression-level: 9
          retention-days: 90
          if-no-files-found: error
