name: Step 7 Structured-error robustness

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  structured-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STEP5_ARTIFACT_ID: '10035125626'
      STEP5_ARTIFACT_SHA256: '889e7df9af279974d46595444bf768c627602d188ca8c93d0f65b30739f16e96'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Step 7 offline corruption smoke test
        env:
          PYTHONPATH: code
        run: python code/test_structured_step7_smoke.py

      - name: Download frozen Step 5 result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .step7_inputs
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STEP5_ARTIFACT_ID}/zip"
          curl --fail --location --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" -o .step7_inputs/step5-oxford-pet-results.zip
          echo "${STEP5_ARTIFACT_SHA256}  .step7_inputs/step5-oxford-pet-results.zip" | sha256sum -c -

      - name: Run real-data Step 7 artifact compatibility preflight
        env:
          PYTHONPATH: code
        run: python code/test_structured_step7_artifact.py .step7_inputs/step5-oxford-pet-results.zip

      - name: Run full Step 7 structured-error robustness campaign
        env:
          PYTHONPATH: code
        run: |
          rm -rf results/step7_structured
          python code/run_structured_step7.py \
            --step5-artifact .step7_inputs/step5-oxford-pet-results.zip \
            --output-dir results/step7_structured \
            --n-test 0 \
            --n-boot 5000

      - name: Verify frozen Step 7 result bytes
        shell: bash
        run: |
          set -euo pipefail
          cd results/step7_structured
          sha256sum -c SHA256SUMS
          test -s step7_summary.csv
          test -s step7_condition_summary.csv
          test -s step7_clustered_ci.csv
          test -s step7_paired_comparisons.json
          test -s step7_adverse_audit.json
          test -s step7_provenance.json
          test -s generated_step7_structured.tex

      - name: Upload Step 7 results
        uses: actions/upload-artifact@v4
        with:
          name: step7-structured-error-results
          path: results/step7_structured/
          compression-level: 9
          retention-days: 90
          if-no-files-found: error
