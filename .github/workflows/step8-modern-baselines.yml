name: Step 8 Modern and fair baselines

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  modern-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      STEP5_ARTIFACT_ID: '10035125626'
      STEP5_ARTIFACT_SHA256: '889e7df9af279974d46595444bf768c627602d188ca8c93d0f65b30739f16e96'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run offline Step 8 smoke test
        env:
          PYTHONPATH: code
        run: python code/test_step8_baselines_smoke.py

      - name: Retrieve public SoftMorph2 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .external/SoftMorph2
          mkdir -p .external
          git clone --depth 1 https://github.com/lisaGUZZI/SoftMorph2.git .external/SoftMorph2
          git -C .external/SoftMorph2 rev-parse HEAD | tee .external/softmorph_commit.txt
          test -s .external/SoftMorph2/SoftMorph_2D.py

      - name: Verify SoftMorph2 product-logic equivalence
        env:
          PYTHONPATH: code
        run: |
          mkdir -p results/step8_baselines
          python code/test_step8_softmorph_api.py \
            .external/SoftMorph2/SoftMorph_2D.py \
            --out results/step8_baselines/softmorph_equivalence.json

      - name: Download frozen Step 5 result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .step8_inputs
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STEP5_ARTIFACT_ID}/zip"
          curl --fail --location --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$URL" -o .step8_inputs/step5-oxford-pet-results.zip
          echo "${STEP5_ARTIFACT_SHA256}  .step8_inputs/step5-oxford-pet-results.zip" | sha256sum -c -

      - name: Run full Step 8 modern/fair baseline campaign
        env:
          PYTHONPATH: code
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(cat .external/softmorph_commit.txt)"
          rm -rf results/step8_baselines_full
          python code/run_baselines_step8.py \
            --step5-artifact .step8_inputs/step5-oxford-pet-results.zip \
            --step7-dir results/step7_structured \
            --softmorph-equivalence-json results/step8_baselines/softmorph_equivalence.json \
            --softmorph-commit "$COMMIT" \
            --outdir results/step8_baselines_full \
            --n-boot 5000
          cp results/step8_baselines/softmorph_equivalence.json results/step8_baselines_full/
          cd results/step8_baselines_full
          rm -f SHA256SUMS
          for f in *; do [ "$f" = SHA256SUMS ] || sha256sum "$f"; done | sort -k2 > SHA256SUMS

      - name: Verify frozen Step 8 result bytes
        shell: bash
        run: |
          set -euo pipefail
          cd results/step8_baselines_full
          sha256sum -c SHA256SUMS
          test -s step8_summary.csv
          test -s step8_clustered_ci.csv
          test -s step8_paired_comparisons.json
          test -s step8_selection.json
          test -s step8_provenance.json
          test -s softmorph_equivalence.json
          test -s generated_step8_baselines.tex

      - name: Upload Step 8 results
        uses: actions/upload-artifact@v4
        with:
          name: step8-modern-baseline-results
          path: results/step8_baselines_full/
          compression-level: 9
          retention-days: 90
          if-no-files-found: error
